services:
  minio:
    image: pgsty/minio:latest
    container_name: l8db-minio
    restart: unless-stopped
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: l8dbadmin
      MINIO_ROOT_PASSWORD: l8dbsecret
      MINIO_REGION: us-east-1
    ports: ["127.0.0.1:${L8DB_MINIO_PORT:-9000}:9000", "127.0.0.1:${L8DB_MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, minio, --version]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  minio-data:
