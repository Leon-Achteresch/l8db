<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>l8db · App-Logo-Entwürfe</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 54px 58px; background: #e9eced; color: #202631; font-family: Arial, Helvetica, sans-serif; }
      header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 34px; }
      h1 { font-size: 39px; letter-spacing: -1.5px; margin: 0; }
      header p { font-size: 18px; color: #59636b; margin: 0; }
      main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
      article { min-height: 486px; background: #f8f9f9; border: 1px solid #cfd6d8; border-radius: 27px; padding: 23px; display: flex; flex-direction: column; justify-content: space-between; }
      .art { height: 370px; border-radius: 19px; background: #dfe5e7; display: flex; align-items: center; justify-content: center; }
      .art img { width: 342px; height: 342px; object-fit: contain; }
      .caption { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px 0; }
      .caption strong { display: block; font-size: 22px; margin-bottom: 4px; }
      .caption span { color: #69737b; font-size: 15px; }
      .caption img { width: 48px; height: 48px; object-fit: contain; }
      @media (max-width: 1100px) { main { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 720px) { body { padding: 24px; } header { display: block; } h1 { font-size: 29px; } header p { margin-top: 8px; } main { grid-template-columns: 1fr; } article { min-height: 420px; } .art { height: 310px; } .art img { width: 285px; height: 285px; } }
    </style>
  </head>
  <body>
    <header><h1>l8db · Neue App-Logo-Entwürfe</h1><p>5 Konzepte · Bildgenerierung</p></header>
    <main>
      <article><div class="art"><img src="01-navy-glass.png" alt="Navy Glass" /></div><div class="caption"><div><strong>Navy Glass</strong><span>l8 auf einem Datenbankstapel</span></div><img src="01-navy-glass.png" alt="" /></div></article>
      <article><div class="art"><img src="02-frosted-light.png" alt="Frosted Light" /></div><div class="caption"><div><strong>Frosted Light</strong><span>Helles Glas mit dunklem l8</span></div><img src="02-frosted-light.png" alt="" /></div></article>
      <article><div class="art"><img src="03-glass-eight.png" alt="Glass Eight" /></div><div class="caption"><div><strong>Glass Eight</strong><span>Datenringe formen die 8</span></div><img src="03-glass-eight.png" alt="" /></div></article>
      <article><div class="art"><img src="04-violet-panel.png" alt="Violet Stack" /></div><div class="caption"><div><strong>Violet Stack</strong><span>l8 im gläsernen DB-Körper</span></div><img src="04-violet-panel.png" alt="" /></div></article>
      <article><div class="art"><img src="05-copper-cutout.png" alt="Copper Cutout" /></div><div class="caption"><div><strong>Copper Cutout</strong><span>l8 als Metall-Aussparung</span></div><img src="05-copper-cutout.png" alt="" /></div></article>
    </main>
  </body>
</html>
