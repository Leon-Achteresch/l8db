name: Feature request
description: Suggest an idea for l8db
title: "[Feature]: "
labels: [enhancement, "status:needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: Which workflow is painful or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: What should l8db do instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Table browser, Query editor, Connections, Backend / providers, Object storage, Extensions, Updater / releases, UI / settings, Documentation, CI / tooling, Other]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Are there existing workarounds or other approaches?
