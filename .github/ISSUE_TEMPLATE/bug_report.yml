name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug, "status:needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Table browser, Query editor, Connections, Backend / providers, Object storage, Extensions, Updater / releases, UI / settings, Documentation, CI / tooling, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Provide the smallest sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead? Include screenshots if useful.
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database provider and version
      placeholder: e.g. PostgreSQL 18, SQLite 3, or not applicable
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: DevTools console, terminal output, or `src-tauri` logs. Redact passwords and hosts.
      render: text
