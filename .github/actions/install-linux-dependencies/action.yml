name: Linux native dependencies
description: Install the desktop build dependencies and optional native smoke tools
inputs:
  smoke:
    description: Install GUI smoke dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      env:
        INSTALL_SMOKE: ${{ inputs.smoke }}
      run: |
        set -euo pipefail
        sudo apt-get update
        packages=(libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf)
        if [ "$INSTALL_SMOKE" = true ]; then
          packages+=(xvfb dbus-x11)
        fi
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
