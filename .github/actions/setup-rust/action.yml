name: Release Rust toolchain
description: Install the verified compiler and restore a cache for this build profile and target
inputs:
  cache:
    description: Build profile cache namespace
    required: true
  targets:
    description: Additional compilation targets
    default: ''
  components:
    description: Additional Rust components
    default: ''
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: 1.99.0
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - id: key
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
        TARGETS: ${{ inputs.targets }}
      run: echo "shared=${CACHE}-${TARGETS//,/-}" >> "$GITHUB_OUTPUT"
    - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      with:
        workspaces: src-tauri -> target
        shared-key: ${{ steps.key.outputs.shared }}
        cache-targets: ${{ inputs.cache != 'packaging' }}
        save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
