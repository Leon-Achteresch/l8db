name: Feature videos

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published app tag to record; leave empty for cleanup
        required: false
        type: string
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write

concurrency:
  group: feature-videos
  cancel-in-progress: false

jobs:
  media:
    if: github.repository == 'Leon-Achteresch/l8db'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag || 'main' }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Plan recordings
        id: plan
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(bun scripts/feature-videos/publish.ts plan)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Install recording tools
        if: inputs.release_tag != '' && steps.plan.outputs.ids != '[]'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bunx playwright install --with-deps chromium
      - name: Build and record
        if: inputs.release_tag != '' && steps.plan.outputs.ids != '[]'
        env:
          FEATURE_VIDEO_IDS: ${{ steps.plan.outputs.ids }}
        run: |
          bun run build
          bun scripts/feature-videos/record.ts
      - name: Checkout current publisher
        if: inputs.release_tag != '' && steps.plan.outputs.ids != '[]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .video-publisher
      - name: Publish media after successful app release
        if: inputs.release_tag != '' && steps.plan.outputs.ids != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun .video-publisher/scripts/feature-videos/publish.ts publish "$RELEASE_TAG"
      - name: Refresh feed and remove expired videos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .video-publisher/scripts/feature-videos/publish.ts ]; then
            bun .video-publisher/scripts/feature-videos/publish.ts cleanup
          else
            bun scripts/feature-videos/publish.ts cleanup
          fi
      - name: Remove temporary recordings
        if: always()
        run: rm -rf test-artifacts/feature-videos
