name: CI

on:
  workflow_call:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Production configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/production-check.mjs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bunx biome check ./src
      - run: bun run build
      - run: bun run test
      - run: bunx playwright install --with-deps chromium webkit
      - name: Install video test encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Feature video playback
        run: |
          L8DB_FEATURE_VIDEO_BROWSER=1 bun test tests/feature-video-browser.test.ts
          L8DB_FEATURE_VIDEO_BROWSER=webkit bun test tests/feature-video-browser.test.ts
      - name: Production CSP and extension isolation
        run: |
          L8DB_PRODUCTION_BROWSER=1 L8DB_EXTENSION_BROWSER=1 bun test tests/production-browser.test.ts tests/extension-browser.test.ts
          L8DB_PRODUCTION_BROWSER=webkit L8DB_EXTENSION_BROWSER=webkit bun test tests/production-browser.test.ts tests/extension-browser.test.ts

  browser-smoke:
    name: Browser regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run build
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics
          path: |
            test-artifacts/browser/
            /tmp/l8db-*.png

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: PostgreSQL and SSH integration
        run: bash scripts/test-postgres-ssh.sh

  platform-build:
    name: Build (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --no-bundle ${{ matrix.args }} -- --locked
