name: CI

on:
  workflow_call:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Production configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.0
      - run: node scripts/production-check.mjs
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: actionlint@1.7.12
      - run: actionlint -shellcheck= -pyflakes=

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bunx biome check ./src
      - run: bun run build
      - run: bun run test
      - uses: ./.github/actions/setup-browsers
      - name: Install video test encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Feature video playback
        run: |
          L8DB_FEATURE_VIDEO_BROWSER=1 bun test tests/feature-video-browser.test.ts
          L8DB_FEATURE_VIDEO_BROWSER=webkit bun test tests/feature-video-browser.test.ts
      - name: Production CSP and extension isolation
        run: |
          bun run extension build extention/password-manager
          L8DB_PRODUCTION_BROWSER=1 L8DB_EXTENSION_BROWSER=1 bun test tests/production-browser.test.ts tests/extension-browser.test.ts
          L8DB_PRODUCTION_BROWSER=webkit L8DB_EXTENSION_BROWSER=webkit bun test tests/production-browser.test.ts tests/extension-browser.test.ts

  browser-smoke:
    name: Browser regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-browsers
      - run: bun run build
      - run: bun run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-diagnostics
          path: |
            test-artifacts/browser/
            /tmp/l8db-*.png

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/install-linux-dependencies
      - uses: ./.github/actions/setup-rust
        with:
          cache: checks
          components: rustfmt,clippy
      - run: cargo fmt --check
        working-directory: src-tauri
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-audit
      - name: RustSec audit
        run: cargo audit --ignore RUSTSEC-2023-0071
        working-directory: src-tauri
      - run: cargo clippy --all-targets --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: PostgreSQL and SSH integration
        run: bash scripts/test-postgres-ssh.sh
      - run: cargo clippy --all-targets --locked --no-default-features
        working-directory: src-tauri

  platform-build:
    name: Build (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, windows-2025]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - uses: ./.github/actions/setup-rust
        with:
          cache: pr-build
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --no-bundle -- --locked
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 0
          CARGO_PROFILE_RELEASE_LTO: false
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 256
