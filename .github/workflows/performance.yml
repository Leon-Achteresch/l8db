name: Performance budgets

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Resource and database request budgets (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:perf:core
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: performance-core-${{ matrix.platform }}
          path: test-artifacts/performance/

  browser:
    name: UI budgets (${{ matrix.platform }}, ${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            engine: chromium
          - platform: macos-15
            engine: webkit
          - platform: windows-2025
            engine: chromium
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-browsers
      - run: bun run test:perf:browser --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: performance-ui-${{ matrix.platform }}-${{ matrix.engine }}
          path: test-artifacts/performance/

  constrained:
    name: UI budgets (4x slower CPU, 256 MiB JS heap limit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-browsers
      - run: bun run test:perf:constrained
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: performance-constrained
          path: test-artifacts/performance/

  database:
    name: SQLite metadata and PostgreSQL server load guards
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/install-linux-dependencies
      - uses: ./.github/actions/setup-rust
        with:
          cache: performance
      - name: SQLite metadata latency and cancellation
        run: |
          mkdir -p test-artifacts/performance
          {
            git rev-parse HEAD
            uname -smr
            lscpu
            free -b
            rustc --version
          } > test-artifacts/performance/native-environment.log
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib metadata_performance_tests -- --nocapture 2>&1 | tee test-artifacts/performance/sqlite-metadata.log
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib db::sqlite::tests::cancellation_interrupts_only_its_query -- --nocapture 2>&1 | tee test-artifacts/performance/sqlite-interrupt.log
      - run: |
          mkdir -p test-artifacts/performance
          bash scripts/test-load-perf.sh 2>&1 | tee test-artifacts/performance/postgres.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: performance-database
          path: test-artifacts/performance/
