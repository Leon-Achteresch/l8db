name: Release

on:
  push:
    branches: [main, canary]
    paths-ignore:
      - packaging/**
      - packaging/README.md
  workflow_dispatch:
    inputs:
      rebuild:
        description: Compile again instead of reusing snapshots of an unpublished run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Leon-Achteresch/l8db' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.state.outputs.mode }}
      version: ${{ steps.state.outputs.version }}
      previous_tag: ${{ steps.state.outputs.previous_tag }}
      reuse_run_id: ${{ steps.state.outputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.0
      - name: Determine release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REBUILD: ${{ inputs.rebuild }}
        run: node .github/scripts/release-plan.mjs
      - name: Prüfe Release-Secrets
        if: steps.state.outputs.mode == 'publish'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository-Secret ${name} fehlt. Einrichtung siehe .github/RELEASING.md."
              exit 1
            fi
          done

  checks:
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish' && needs.prepare.outputs.reuse_run_id == ''
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            binary: src-tauri/target/aarch64-apple-darwin/release/l8db
          - platform: macos-x64
            runner: macos-15
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            binary: src-tauri/target/x86_64-apple-darwin/release/l8db
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            binary: src-tauri/target/x86_64-unknown-linux-gnu/release/l8db
          - platform: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            binary: src-tauri/target/x86_64-pc-windows-msvc/release/l8db.exe
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.0
      - name: Apply release version and notes
        shell: bash
        run: node .github/scripts/set-version.mjs "$RELEASE_VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - uses: ./.github/actions/install-linux-dependencies
      - uses: ./.github/actions/setup-rust
        with:
          cache: release
          targets: ${{ matrix.rust_targets }}
      - run: bun install --frozen-lockfile
      - name: Compile without signing credentials
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: bun run tauri build --ci --no-bundle --target "$RELEASE_TARGET" -- --locked
      - run: node .github/scripts/build-snapshot.mjs record
      - name: Archive compiled snapshot
        shell: bash
        run: tar -czf build.tar "$RELEASE_BINARY" "build-$RELEASE_PLATFORM.json" dist public/third-party-licenses.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiled-${{ matrix.platform }}
          path: build.tar
          compression-level: 0
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  draft:
    needs: [prepare, checks, build]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.reuse_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.0
      - name: Apply release version and notes
        shell: bash
        run: node .github/scripts/set-version.mjs "$RELEASE_VERSION"
      - run: node .github/scripts/release.mjs draft
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: [prepare, draft, build, checks]
    if: ${{ !cancelled() && needs.draft.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.reuse_run_id != '')) }}
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            binary: src-tauri/target/universal-apple-darwin/release/l8db
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            binary: src-tauri/target/x86_64-unknown-linux-gnu/release/l8db
            bundle: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          - platform: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            binary: src-tauri/target/x86_64-pc-windows-msvc/release/l8db.exe
            bundle: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_BINARY: ${{ matrix.binary }}
      RELEASE_BUNDLE: ${{ matrix.bundle }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.0
      - name: Apply release version and notes
        shell: bash
        run: node .github/scripts/set-version.mjs "$RELEASE_VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - uses: ./.github/actions/install-linux-dependencies
        with:
          smoke: 'true'
      - uses: ./.github/actions/setup-rust
        with:
          cache: packaging
          targets: ${{ matrix.rust_targets }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: compiled-${{ matrix.platform }}*
          path: compiled
          run-id: ${{ needs.prepare.outputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Restore and verify compiled snapshot
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in compiled/build.tar compiled/*/build.tar; do
            if [ -f "$archive" ]; then tar -xzf "$archive"; fi
          done
          if [ "$RELEASE_PLATFORM" = macos ]; then
            for arch in arm64:aarch64 x64:x86_64; do
              RELEASE_PLATFORM="macos-${arch%%:*}" RELEASE_BINARY="src-tauri/target/${arch#*:}-apple-darwin/release/l8db" \
                node .github/scripts/build-snapshot.mjs verify
            done
            mkdir -p "$(dirname "$RELEASE_BINARY")"
            lipo -create -output "$RELEASE_BINARY" \
              src-tauri/target/aarch64-apple-darwin/release/l8db \
              src-tauri/target/x86_64-apple-darwin/release/l8db
            node .github/scripts/build-snapshot.mjs record
          else
            node .github/scripts/build-snapshot.mjs verify
          fi
      - name: Importiere Apple Developer ID
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          certificate_path="$RUNNER_TEMP/l8db-signing.p12"
          keychain_path="$RUNNER_TEMP/l8db-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain_path" | grep -F 'Developer ID Application: LEON ACHTERESCH (R4LQCWA594)'
      - name: Sign and bundle the compiled application
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "${{ runner.os == 'macOS' && 'Developer ID Application: LEON ACHTERESCH (R4LQCWA594)' || '' }}"
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: "${{ runner.os == 'macOS' && 'R4LQCWA594' || '' }}"
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ] && [[ "$RELEASE_VERSION" == *-canary.* ]]; then
            rpm_config="$(printf '{"version":"%s","bundle":{"linux":{"rpm":{"release":"0.canary.%s"}}}}' "${RELEASE_VERSION%-canary.*}" "${RELEASE_VERSION##*-canary.}")"
            bun run tauri bundle --ci --target "$RELEASE_TARGET" --bundles appimage,deb
            bun run tauri bundle --ci --target "$RELEASE_TARGET" --bundles rpm --config "$rpm_config"
          else
            bun run tauri bundle --ci --target "$RELEASE_TARGET"
          fi
      - name: Prüfe macOS-Signatur und Notarisierung
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app_path="$RELEASE_BUNDLE/macos/l8db.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature" | grep -F 'Authority=Developer ID Application: LEON ACHTERESCH (R4LQCWA594)'
          printf '%s\n' "$signature" | grep -F 'TeamIdentifier=R4LQCWA594'
          printf '%s\n' "$signature" | grep -F '(runtime)'
          codesign --display --entitlements - --xml "$app_path" | grep -F 'com.apple.security.cs.disable-library-validation'
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
      - run: node .github/scripts/package-release.mjs
      - name: Native installer and upgrade smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session node .github/scripts/release-smoke.mjs
          else
            node .github/scripts/release-smoke.mjs
          fi
      - name: Upload verified platform artifacts to draft
        run: node .github/scripts/release.mjs upload
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: packaged-${{ matrix.platform }}-${{ github.run_attempt }}
          path: release-assets/*.json
          retention-days: 14
      - name: Entferne temporären Apple-Schlüsselbund
        if: always() && runner.os == 'macOS'
        run: |
          keychain_path="$RUNNER_TEMP/l8db-signing.keychain-db"
          if [ -f "$keychain_path" ]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/l8db-signing.p12"

  finalize:
    needs: [prepare, checks, build, package]
    if: ${{ !cancelled() && needs.package.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.reuse_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.0
      - name: Apply release version and notes
        shell: bash
        run: node .github/scripts/set-version.mjs "$RELEASE_VERSION"
      - name: Verify signatures, assemble updater manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: node .github/scripts/release.mjs publish

  summary:
    needs: [prepare, checks, build, package, finalize]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node .github/scripts/release-summary.mjs
        env:
          GH_TOKEN: ${{ github.token }}
