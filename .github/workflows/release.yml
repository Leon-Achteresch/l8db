name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Prüfe Release-Secrets
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository-Secret TAURI_SIGNING_PRIVATE_KEY fehlt. Auto-Updates benötigen signierte Artefakte."
            exit 1
          fi
          if [ -z "$RELEASE_PR_TOKEN" ]; then
            echo "::error::Repository-Secret RELEASE_PR_TOKEN fehlt. Einrichtung siehe .github/RELEASING.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Berechne Release-Version
        id: version
        shell: bash
        run: |
          version="$(node .github/scripts/compute-release-version.mjs)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Erzeuge Release-Notes
        id: changelog
        shell: bash
        run: |
          body="$(node .github/scripts/generate-changelog.mjs --next "${{ steps.version.outputs.version }}" --release-body)"
          {
            echo "changelog<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin -- --locked
          - platform: ubuntu-22.04
            args: -- --locked
          - platform: windows-latest
            args: -- --locked

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setze Release-Version
        run: node .github/scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Erzeuge CHANGELOG.md für die App
        run: node .github/scripts/generate-changelog.mjs --next "${{ needs.prepare.outputs.version }}"

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build und veroeffentliche Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: l8db v__VERSION__
          releaseBody: ${{ needs.prepare.outputs.changelog }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          appVersion: ${{ needs.prepare.outputs.version }}
          args: ${{ matrix.args }}

  finalize:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfe vollständige Update-Artefakte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release download "v${RELEASE_VERSION}" --pattern latest.json --dir "$RUNNER_TEMP/release"
          gh release view "v${RELEASE_VERSION}" --json assets > "$RUNNER_TEMP/release/assets.json"
          node .github/scripts/verify-release.mjs "$RUNNER_TEMP/release/latest.json" "$RUNNER_TEMP/release/assets.json" "$RELEASE_VERSION"
      - name: Veröffentliche vollständigen Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${RELEASE_VERSION}" --draft=false --latest

  changelog:
    needs: [prepare, finalize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aktualisiere CHANGELOG.md
        run: node .github/scripts/generate-changelog.mjs

      - name: Erstelle oder aktualisiere Changelog-PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          base: main
          branch: automation/changelog
          add-paths: CHANGELOG.md
          commit-message: "docs(changelog): Release-Notes für v${{ needs.prepare.outputs.version }}"
          title: "docs(changelog): Release-Notes für v${{ needs.prepare.outputs.version }}"
          body: |
            Aktualisiert CHANGELOG.md nach dem erfolgreichen Release v${{ needs.prepare.outputs.version }}.

            Dieser PR wird bei weiteren Releases aktualisiert und durchläuft die regulären Reviews und Pflichtchecks für main.
            Der Merge löst bei ausschließlichen Änderungen an CHANGELOG.md kein weiteres Release aus.
