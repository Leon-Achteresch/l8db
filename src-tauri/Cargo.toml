[package]
name = "l8db"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "l8db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
sha2 = "0.10"
url = "2"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
russh = "0.63"
bb8 = "0.9"
bb8-postgres = "0.9"
tokio = { version = "1", features = ["time", "macros", "rt", "process", "io-util"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "native-tls-tls"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
chrono = "0.4"
tokio-util = { version = "0.7", features = ["compat"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls", "charset", "http2"] }
mongodb = "3"
redis = { version = "1", features = ["tokio-comp", "tokio-native-tls-comp"] }
oracle = "0.6"
scylla = "1"
futures-util = "0.3"
duckdb = { version = "1", features = ["bundled"], optional = true }
odbc-api = { version = "29", optional = true }

[features]
default = []
duckdb = ["dep:duckdb"]
odbc = ["dep:odbc-api"]

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

